<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="../src/fonts/Lato-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="../src/fonts/Roboto-Regular.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="../src/fonts/Roboto-Bold.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <title>Image Search Abstraction Layer</title>
</head>
<body>
   
    <aside>
        
    </aside>
   <header class="header">
   
    <div class="header__container">
        <h1>Image Search <span>Abstraction Layer</span></h1>

        <form autocomplete="off" class="header__form">
            <label for="search">What are you looking for?</label>
            <div class="header__form__block">
                <input type="text" id="search" name="search" maxlength="50" placeholder="E.g.: funny cats">
                <button type="submit" id="btn-search">
                 Search
                </button>
            </div>
            
           
        </form>

        <section class="header__recent">
            <h2>Recent Searches:</h2>
            <ul id="list-recent" class="header__recent__list"></ul>
            <div class="loader loader-recent"></div>
        </div>
      
    </div> 
   </header>

   <main id="main" class="main container">
    <h2>Results:</h2>
    <div class="loader loader-grid"></div>
    <div class="main__results" id="container-result">
       
    </div>
   </main>
  
   <div class="sliders container">
    <button class="sliders__preview" id="preview" type="button"></button>
    <button class="sliders__next" id="next" type="button"></button>
  
   </div>
</body>
</html>
